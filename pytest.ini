[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --alluredir=reports/allure-results
markers =
    smoke: critical happy-path checks
    regression: full regression suite
    ui: browser-based tests
    api: API tests
    flaky: known unstable, allowed reruns
    owner(name): test owner, e.g. owner("nikita")
    priority(level): P0/P1/P2/P3
    case_id(id): TMS case id, e.g. case_id("TC-123")
