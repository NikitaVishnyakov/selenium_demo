[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --alluredir=reports/allure-results
markers =
    smoke: critical happy-path checks
    auth: Basic Auth valid/invalid/missing checks
    functional: CRUD happy-path per endpoint
    contract: schema/response validation against the OpenAPI spec
    tenant: tenant isolation / BOLA regression (P0)
    negative: boundary and malformed-input cases
    deadlock: BUG-01 write-deadlock regression, must run isolated from the main suite
    load: load/reliability tests (locust-driven)
    flaky: known unstable, allowed reruns (pytest-rerunfailures)
    owner(name): test owner, e.g. @pytest.mark.owner("Nikita.Vyshniakov")
    case_id(id): stable test-case id from docs/test_strategy.md, e.g. @pytest.mark.case_id("TC-AUTH-01")
    priority(level): P0 (critical) / P1 (high) / P2 (medium-low), e.g. @pytest.mark.priority("P0")
